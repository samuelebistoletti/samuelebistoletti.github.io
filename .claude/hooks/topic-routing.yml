# ─── Tips ──────────────────────────────────────────────────────────────
#
# - Multiple files per keyword are loaded in the order listed.
# - Keep the routing table under 100 entries; beyond that, the hook adds
#   noticeable latency on every prompt submission.
# - Quote keywords containing spaces or special characters: "data ops".
# - Lowercase keywords only. Matching is case-insensitive.
# - Run the auto-load-topics hook after editing this file to verify your
#   keyword -> file map resolves correctly.
