# Topic Routing , keywords map to memory and skill destinations.
#
# Used by:
# - validate-handoff.sh (verify domain routing on /safe-clear)
# - inject-related-context.sh (load relevant past handoffs after compact)
# - auto-load-topics.sh (surface relevant skills/memory on UserPromptSubmit)
# - safe-clear command (write to multiple destinations)
#
# Format: keyword (lowercase, matched case-insensitively) -> list of file paths.
# All paths relative to CLAUDE_PROJECT_DIR.
#
# Customise this for YOUR project. The examples below are illustrative;
# delete them and add your own keyword -> file mappings. The pattern is:
# whenever you find yourself mentioning a topic repeatedly in your prompts,
# add it here so Claude loads the relevant context automatically.

# ─── Examples (delete and replace with your own) ───────────────────────

# Example: a project or product area
# my-project:
#   - .claude/skills/my-project/SKILL.md
#   - memory/project_my-project.md

# Example: a third-party system or integration
# stripe:
#   - .claude/skills/stripe/SKILL.md
#   - memory/integration_stripe.md

# Example: a domain or service you work in
# analytics:
#   - .claude/skills/analytics/SKILL.md

# ─── Common system topics (uncomment if you use these) ─────────────────

# git:
#   - .claude/skills/git-workflow/SKILL.md

# deploy:
#   - .claude/commands/deploy.md
#   - memory/deployment-notes.md

# testing:
#   - .claude/skills/testing/SKILL.md

# ─── Active routes (Claudify system layer) ─────────────────────────────

